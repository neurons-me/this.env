<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>this.env Dashboard</title>
  <style>
    .footer {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: #888;
      font-size: 14px;
      font-family: 'Roboto', sans-serif;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .footer a:hover {
      color: #aaa;
    }
    body {
      margin: 0;
      padding: 0;
      background: #1e1e1e;
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 34px;
      max-width: 500px;
      width: 100%;
    }

    .card {
      background-color: #2d2d2d;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: #e4e4e4;
      box-shadow: 0 0 3px rgba(134, 177, 147, 0.4);
      transition: background-color 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      background-color: #383838;
      transform: translateY(-3px);
    }

    .card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      color: #a0a0a0;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 21px 34px 55px;
      margin-bottom: 42px;
      width: 100%;
    }

    .title {
      color: white;
      font-size: 48px;
      font-weight: bold;
      font-family: 'Roboto', sans-serif;
      margin-bottom: 8px;
      text-align: center;
    }
    .card i {
      color: white;
      width: 28px;
      height: 28px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
  <div class="wrapper">
    <h1 class="title">This.Env</h1>
    <div class="container">
      <div class="card" onclick="location.href='/__env/status'">
        <i data-feather="activity"></i>
        <h3>Status</h3>
        <p>Check environment status</p>
      </div>
      <div class="card" onclick="location.href='/__env/logs'">
        <i data-feather="file-text"></i>
        <h3>Logs</h3>
        <p>View access history</p>
      </div>
      <div class="card" onclick="location.href='/__env/docs'">
        <i data-feather="book"></i>
        <h3>Docs</h3>
        <p>Read the documentation</p>
      </div>
    </div>
  </div>
<script>
  feather.replace();
</script>
</body>
  <footer class="footer">
    <a href="https://neurons.me" target="_blank">
      <img src="https://neurons.me/media/neurons-grey.png" alt="neurons.me" height="42" style="vertical-align: middle; margin-right: 8px;" />
      <span>neurons.me</span>
    </a>
  </footer>
</html>
